<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitsy - Motion Showreel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'ClashDisplay';
      src: url('../public/fonts/ClashDisplay-Variable.woff2') format('woff2');
      font-weight: 200 700;
      font-display: block;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'ClashDisplay', sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #071421;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 50px;
      backdrop-filter: blur(10px);
    }

    button {
      background: #2775ca;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-family: 'ClashDisplay', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    button:hover {
      background: #0a4f96;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #2775ca;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading...</div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="exportBtn">Export Video</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="showreel.js"></script>
</body>
</html>
